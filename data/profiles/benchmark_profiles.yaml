# Benchmark student profiles — representative CS-junior archetypes used by the
# Streamlit app's profile picker and (later) the evaluation corpus. Each entry is
# a self-contained instance: a `student` (state) + a `scenario` (request), per
# docs/evaluation_plan.md §2.1. These bundle the two layers ONLY for the benchmark;
# the core data files (student_iter2.yaml, scenario_iter2.yaml) stay separate.
#
# Validated 2026-10-20: every profile solves to the stated `expect` status and,
# when feasible, the solver plan passes check_plan_iter2.
#
# scenario fields: target_semesters, max_units_per_semester, focus_area,
# industrial_option, want_fyp, want_urop, term_layout (C5), and preferences
# (per_semester_cap C1, max_cs_modules_per_sem C2, min_units_per_semester,
# no_empty_semesters, heavy_conflicts).

on_track_fresh:
  label: "On-track fresh Year 1"
  description: "Standard intake: A-level H2 Maths, direct English, AI focus, 4-year plan."
  expect: feasible
  student:
    conditions: {needs_math_bridging: false, english_path: direct_es2660}
    has_h2_math: true
    eligible_fyp: false
    eligible_urop: true
    completed: {}
    exempted: {}
  scenario:
    target_semesters: 8
    max_units_per_semester: 20
    focus_area: artificial_intelligence
    industrial_option: any
    want_fyp: false
    want_urop: false
    preferences: {per_semester_cap: {}, max_cs_modules_per_sem: 0, min_units_per_semester: 0, no_empty_semesters: false, heavy_conflicts: []}

