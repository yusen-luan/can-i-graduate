notes:
- exempted=true means the module requirement and downstream prerequisite are treated
  as satisfied without scheduling the module.
- Set needs_math_bridging=true for students who must satisfy MA1301 or MA1301X before
  MA1521, MA1522, and CS1231S.
- english_path=direct_es2660 models the normal baseline student who may take ES2660
  directly.
- english_path=es1103_required requires ES1103 before ES2660.
- english_path=es1000_then_es1103 requires ES1000 before ES1103, and ES1103 before
  ES2660.
