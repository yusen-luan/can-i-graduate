# CS Focus Areas — BComp(CS) AY2026/27.
# Source: https://www.comp.nus.edu.sg/programmes/ug/focus
# Primaries validated against the NUSMods AY2026/27 snapshot; codes that no
# longer exist in AY2026/27 were dropped (CS4232 — flagged by ingest report).
