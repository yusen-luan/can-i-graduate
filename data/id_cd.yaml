# Interdisciplinary (ID) & Cross-Disciplinary (CD) courses. AUTHORITATIVE REFERENCE.
# Source: SoC Common Curriculum Appendix B (ID) and Appendix C (CD), user-provided 2026-10-19.
# Rule: 12 units total, >= 2 ID courses and <= 1 CD course.
# The CSP wires `wired_subset`; the full lists below are the auditable reference.
rule:
  total_units: 12
  min_id_courses: 2
  max_cd_courses: 1

interdisciplinary:
  wired_subset: [DTK1234, IE2141, IS1128, HSI1000]
  full:
    college_design_engineering: [CDE2501, EG2501, DTK1234, EG1311, IE2141, PF1101A]
    school_of_computing: [IS1128, IS2218, IS2238]
    chs: [HSH1000, HSS1000, HSA1000, HSI1000, HSI2001, HSI2002, HSI2003, HSI2004,
      HSI2005, HSI2007, HSI2008, HSI2009, HSI2010, HSI2011, HSI2013, HSI2014]

cross_disciplinary:
  wired_subset: [DAO2703, SC1101E, GE2103]
  full: [ACC1701, DAO2703, MNO1706X, SC1101E, EL1101E, PE2101P, GE2103, XD3103,
    GE3253, GE3255, GE3256, SPH2002, SC2226, NUR1113A, CDE2300, CDE2310, EG2201A, EG2310]
  # Plus: any course from Chemistry (CM), Physics (PC), Biological Sciences (LSM/ZB).
  prefix_rule: [CM, PC, LSM, ZB]
